<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --ink:#241553; --purple:#6c3ce0; --violet:#8b5cf6; --pink:#ff5ca8; --yellow:#ffc531;
  --teal:#14c8b8; --blue:#3b82f6; --orange:#ff8a3d; --green:#2fcf6b; --red:#ff4d5e;
  --bg:#efe8ff; --card:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Nunito","Trebuchet MS","Avenir Next Rounded","Arial Rounded MT Bold",system-ui,sans-serif;
  font-weight:700;color:var(--ink);background-color:var(--bg);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' viewBox='0 0 160 160'><g fill='none' stroke='%23d5c6fb' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M20 24h16M28 16v16'/><path d='M104 30h16'/><path d='M60 70l12 12M72 70L60 82'/><path d='M120 96h18M129 88v0M129 104v0'/><path d='M24 110v26M24 136h26'/><path d='M30 130l6-8 8 4 8-12'/><circle cx='88' cy='128' r='6'/><circle cx='138' cy='40' r='4'/><circle cx='50' cy='50' r='3'/><path d='M96 70l10 16h-20z'/></g><g fill='%23d5c6fb' font-family='Arial' font-weight='bold' font-size='20'><text x='70' y='30'>x</text><text x='118' y='140'>y</text><text x='10' y='84'>=</text><text x='140' y='80'>²</text></g></svg>");
  background-size:160px 160px;
  min-height:100vh;line-height:1.35;
}
#app{max-width:520px;margin:0 auto;padding:0 14px 150px;min-height:100vh}
.fb,.psol{scroll-margin-bottom:140px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}

/* header */
.top{position:sticky;top:0;z-index:20;margin:0 -14px;padding:12px 14px;background:var(--purple);border-bottom:3px solid var(--ink);display:flex;align-items:center;gap:10px;color:#fff}
.logo{flex:1;font-size:19px;font-weight:900;letter-spacing:.2px;line-height:1.05}
.logo small{display:block;font-size:12px;opacity:.85;font-weight:700}
.chip-s{background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:99px;padding:4px 11px;font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}

.hero{margin:16px 0 4px;background:var(--yellow);border:3px solid var(--ink);border-radius:22px;padding:14px 16px;box-shadow:0 5px 0 var(--ink)}
.hero b{font-size:17px;font-weight:900}
.hero p{font-size:14px;margin-top:3px;font-weight:700}
.bar{height:16px;border-radius:99px;background:#fff;border:2.5px solid var(--ink);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-right:2.5px solid var(--ink);transition:width .5s}

/* wereld */
.world{margin-top:22px}
.wban{border:3px solid var(--ink);border-radius:22px;padding:13px 16px;color:#fff;box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;gap:12px}
.wban .big{font-size:34px;line-height:1}
.wban h2{font-size:20px;font-weight:900;line-height:1.1}
.wban p{font-size:13px;opacity:.95;margin-top:2px}
.wban .cnt{margin-left:auto;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:900;white-space:nowrap}
.wban.dark{color:var(--ink)}
.path{position:relative;padding:8px 0 4px;display:flex;flex-direction:column;align-items:center}
.path:before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:5px dotted #b9a4f5;transform:translateX(-50%)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;margin:10px 0;width:170px}
.node:nth-child(4n+1){transform:translateX(-46px)}
.node:nth-child(4n+3){transform:translateX(46px)}
.dot{width:78px;height:78px;border-radius:50%;border:3.5px solid var(--ink);display:grid;place-items:center;font-size:34px;background:var(--c,#8b5cf6);box-shadow:0 6px 0 var(--ink);transition:transform .1s}
.dot:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.node.locked .dot{background:#d9d4e8;filter:grayscale(.3);font-size:28px}
.node.current .dot{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 var(--ink),0 0 0 0 rgba(255,197,49,.9)}50%{box-shadow:0 6px 0 var(--ink),0 0 0 12px rgba(255,197,49,0)}}
.nlab{margin-top:9px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:2px 9px;font-size:13px;font-weight:900;text-align:center}
.stars{font-size:15px;letter-spacing:1px;margin-top:3px;text-shadow:0 1px 0 #fff}
.stars .off{filter:grayscale(1);opacity:.35}

/* toets-kaarten */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tcard{border:3px solid var(--ink);border-radius:20px;background:#fff;padding:14px 10px;text-align:center;box-shadow:0 5px 0 var(--ink);font-weight:900}
.tcard .n{font-size:30px}
.tcard small{display:block;font-weight:700;font-size:12px;margin-top:3px}
.tcard.locked{background:#e3dff0;color:#7d7699}
.tcard .best{display:inline-block;margin-top:6px;background:var(--yellow);border:2.5px solid var(--ink);border-radius:99px;padding:1px 9px;font-size:13px;color:var(--ink)}

/* knoppen */
.btn{display:block;width:100%;border:3px solid var(--ink);background:var(--green);color:#fff;border-radius:18px;padding:14px 16px;font-size:18px;font-weight:900;box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink);text-shadow:none}
.btn.pink{background:var(--pink)}
.btn.purple{background:var(--purple)}
.btn:disabled{background:#cfc8e4;color:#8d86a8;box-shadow:0 5px 0 #8d86a8;border-color:#8d86a8;text-shadow:none;cursor:not-allowed}
.link{background:none;border:none;text-decoration:underline;font-weight:800;color:var(--purple);padding:8px}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(36,21,83,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:#fff;width:100%;max-width:520px;border:3px solid var(--ink);border-bottom:none;border-radius:26px 26px 0 0;padding:18px 18px 26px;max-height:88vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(60px)}to{transform:none}}
.sheet h3{font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px}
.sheet .ico{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:24px}
.learn{background:#f6f1ff;border:2.5px solid var(--ink);border-radius:16px;padding:10px 14px;margin:14px 0;font-weight:700;font-size:15px}
.learn b.t{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--purple);margin-bottom:4px}

.x{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-weight:900;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.prog{flex:1;display:flex;gap:5px}

.qcard{margin-top:16px;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--ink)}
.ctx{margin-bottom:12px}
.ctxt{font-size:15px;margin-bottom:8px}
.pq{font-size:17px;font-weight:800;margin-bottom:12px}
.plabel{color:var(--purple)}

.opt.right{background:#c9f5d8;border-color:var(--ink);outline:3px solid var(--green)}

<body>
<div id="app"></div>
<script>
'use strict';
/* ===== hulpfuncties ===== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

const coin=()=>Math.random()<.5;

const r2=n=>Math.round(n*100)/100;
const nl=n=>String(r2(n)).replace('.',',').replace('-','−');
const fm=n=>Number.isInteger(n)?String(n):n.toFixed(2).replace('.',',');
const eur=n=>'€ '+fm(r2(n));
function hf(n){const neg=n<0,a=Math.abs(n),w=Math.floor(a),half=a-w>0.25;let s=(w>0||!half)?String(w):'';if(half)s+='½';return (neg&&a>0?'−':'')+s;}

const pt=(x,y)=>(Number.isInteger(x)&&Number.isInteger(y))?`(${nl(x)}, ${nl(y)})`:`(${nl(x)}; ${nl(y)})`;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function toNum(s){
  s=String(s).trim().replace(/[−–—]/g,'-').replace(/€|°C|°|%|\s/g,'');
  const m=s.match(/^(-?)(\d*)½$/); if(m){return (m[1]?-1:1)*((m[2]?parseInt(m[2],10):0)+0.5);}
  s=s.replace(',','.');
  if(!/^-?\d*\.?\d+$/.test(s))return NaN; return parseFloat(s);
}
function wr(right,cands,pad){const out=[];const p=pad||[];for(const c of cands.concat(p)){const s=String(c);if(s!==String(right)&&!out.includes(s))out.push(s);if(out.length===3)break;}let k=1;while(out.length<3){const s=String(Number(right)+k*(k%2?1:-1)*Math.ceil(k/2)); if(s!==String(right)&&!out.includes(s))out.push(s);k++;}return out;}
function niceStep(max){const L=[1,2,5,10,20,25,50,100,200,250,500,1000];for(const s of L){if(max/s<=10)return s;}return 1000;}
function axisFor(vals,minZero=true){const mx=Math.max(...vals),mn=Math.min(...vals);const step=niceStep(Math.max(mx,Math.abs(mn)));const max=Math.ceil(mx/step)*step||step;const min=(mn<0||!minZero)?Math.floor(mn/step)*step:0;return {min,max:Math.max(max,step),step};}

/* ===== vraag-bouwstenen ===== */
const mc=(q,right,wrongs,uitleg,o={})=>{const ws=[];wrongs.forEach(w=>{if(w!==right&&!ws.includes(w))ws.push(w);});const opts=shuffle([right,...ws]);return {type:'mc',q,opts,a:opts.indexOf(right),uitleg,pts:o.pts||1,ctx:o.ctx};};
const num=(q,a,uitleg,o={})=>({type:'num',q,a,uitleg,pts:o.pts||1,pre:o.pre||'',post:o.post||'',neg:o.neg||a<0,tol:o.tol!=null?o.tol:0.0051,ctx:o.ctx});
const nums=(q,a,uitleg,o={})=>({type:'nums',q,a,uitleg,pts:o.pts||1,post:o.post||'',neg:o.neg||a.some(v=>v<0),ctx:o.ctx});
const txt=(q,re,show,uitleg,o={})=>({type:'txt',q,re,show,uitleg,pts:o.pts||1,ctx:o.ctx});
const xy=(q,a,uitleg,o={})=>({type:'xy',q,a,uitleg,pts:o.pts||1,labels:o.labels||['x =','y ='],ctx:o.ctx,fmt:o.fmt});
const table=(q,t,uitleg,o={})=>({type:'table',q,table:t,uitleg,pts:o.pts||1,ctx:o.ctx,money:o.money,pre:o.pre||''});
const plot=(q,o)=>Object.assign({type:'plot',q,pts:1,mode:'set',connect:'none',snap:{x:1,y:1},tol:{x:0,y:0}},o);

/* ===== assenstelsel tekenen (SVG) ===== */
const NS='http://www.w3.org/2000/svg';
function S(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const PAL=['#ff5ca8','#3b82f6','#14c8b8','#ff8a3d','#8b5cf6','#2fcf6b','#e11d48','#0ea5e9'];
function gridSVG(g0){
  let g=Object.assign({xs:1,ys:1},g0);
  const coord=g.style==='coord';
  if(g.zaag==='y'&&!coord){g.ymin=g.ymin-g.ys;}
  const xr=g.xmax-g.xmin,yr=g.ymax-g.ymin;
  const m=coord?{l:26,r:30,t:30,b:26}:{l:g.ml||44,r:22,t:24,b:g.xlab?46:34};
  const W=g.w||330,H=g.h||(coord?330:270);
  let cx,cy;

  const pw=cx*xr,ph=cy*yr,vw=pw+m.l+m.r,vh=ph+m.t+m.b;
  const svg=S('svg',{viewBox:`0 0 ${vw} ${vh}`,class:'grid'});
  svg.style.maxWidth=Math.round(vw*1.35)+'px';
  const X=x=>m.l+(x-g.xmin)*cx,Y=y=>m.t+(g.ymax-y)*cy;
  const nx=Math.round(xr/g.xs),ny=Math.round(yr/g.ys);

  for(let i=0;i<=nx;i++){const x=g.xmin+i*g.xs;S('line',{x1:X(x),y1:m.t,x2:X(x),y2:m.t+ph,stroke:'#d6d0ee','stroke-width':1.2},svg);}
  for(let i=0;i<=ny;i++){const y=g.ymin+i*g.ys;S('line',{x1:m.l,y1:Y(y),x2:m.l+pw,y2:Y(y),stroke:'#d6d0ee','stroke-width':1.2},svg);}
  const T=(x,y,t,o={})=>{const e=S('text',Object.assign({x,y,'font-size':o.fs||12,'font-weight':800,fill:'#241553','text-anchor':o.a||'middle'},o.at||{}),svg);e.textContent=t;return e;};
  const INK='#241553';
  if(coord){
    const x0=Math.max(g.xmin,Math.min(g.xmax,0)),y0=Math.max(g.ymin,Math.min(g.ymax,0));
    S('line',{x1:X(g.xmin)-6,y1:Y(y0),x2:X(g.xmax)+16,y2:Y(y0),stroke:INK,'stroke-width':2.4},svg);
    S('polygon',{points:`${X(g.xmax)+22},${Y(y0)} ${X(g.xmax)+12},${Y(y0)-5} ${X(g.xmax)+12},${Y(y0)+5}`,fill:INK},svg);
    S('line',{x1:X(x0),y1:Y(g.ymin)+6,x2:X(x0),y2:Y(g.ymax)-16,stroke:INK,'stroke-width':2.4},svg);
    S('polygon',{points:`${X(x0)},${Y(g.ymax)-22} ${X(x0)-5},${Y(g.ymax)-12} ${X(x0)+5},${Y(g.ymax)-12}`,fill:INK},svg);
    for(let i=0;i<=nx;i+=1){const x=g.xmin+i*g.xs;if(Math.abs(x)<1e-9||i%lx)continue;T(X(x),Y(y0)+15,nl(x));}
    for(let i=0;i<=ny;i+=1){const y=g.ymin+i*g.ys;if(Math.abs(y)<1e-9||i%ly)continue;T(X(x0)-6,Y(y)+4,nl(y),{a:'end'});}
    T(X(x0)-9,Y(y0)+15,'O',{fs:13});
    T(X(g.xmax)+20,Y(y0)-9,'x',{fs:15,at:{'font-style':'italic'}});
    T(X(x0)+11,Y(g.ymax)-14,'y',{fs:15,at:{'font-style':'italic'}});
  }else{
    if(g.xmin<0&&g.xmax>0)S('line',{x1:X(0),y1:m.t,x2:X(0),y2:m.t+ph,stroke:INK,'stroke-width':1.8},svg);
    if(g.ymin<0&&g.ymax>0)S('line',{x1:m.l,y1:Y(0),x2:m.l+pw,y2:Y(0),stroke:INK,'stroke-width':1.8},svg);
    S('line',{x1:m.l,y1:m.t-4,x2:m.l,y2:m.t+ph,stroke:INK,'stroke-width':2.6},svg);
    S('line',{x1:m.l,y1:m.t+ph,x2:m.l+pw+4,y2:m.t+ph,stroke:INK,'stroke-width':2.6},svg);
    for(let i=0;i<=nx;i++){if(i%lx)continue;const x=g.xmin+i*g.xs;const lab=g.xnames?(g.xnames[i-1]||''):nl(x);if(lab!=='')T(X(x),m.t+ph+16,lab);}
    for(let i=0;i<=ny;i++){if(i%ly)continue;const y=g.ymin+i*g.ys;const lab=(g.zaag==='y'&&i===0)?'0':nl(y);T(m.l-7,Y(y)+4,lab,{a:'end'});}
    if(g.zaag==='y'){const x=m.l,y1=Y(g.ymin),y2=Y(g.ymin+g.ys);S('rect',{x:x-4,y:y2,width:8,height:y1-y2,fill:'#fff'},svg);S('polyline',{points:`${x},${y1} ${x},${y1-(y1-y2)*.2} ${x-6},${y1-(y1-y2)*.4} ${x+6},${y1-(y1-y2)*.6} ${x},${y1-(y1-y2)*.8} ${x},${y2}`,fill:'none',stroke:INK,'stroke-width':2.2},svg);}

    if(g.title)T(m.l+pw/2,12,g.title,{fs:12,at:{'letter-spacing':'1px'}});
  }
  const layer=S('g',{},svg);
  const toData=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return {x:g.xmin+(q.x-m.l)/cx,y:g.ymax-(q.y-m.t)/cy};};

function mk(gs,x,y,o={}){
  const G=S('g',{},gs.layer);
  if(o.ring){S('circle',{cx:gs.X(x),cy:gs.Y(y),r:9,fill:'none',stroke:'#16a34a','stroke-width':3,'stroke-dasharray':'3 2'},G);}
  else S('circle',{cx:gs.X(x),cy:gs.Y(y),r:o.r||5.5,fill:o.fill||'#ff4d6d',stroke:'#241553','stroke-width':o.sw||2},G);
  if(o.label){const t=S('text',{x:gs.X(x)+8,y:gs.Y(y)-8,'font-size':13,'font-weight':900,fill:o.lc||'#241553'},G);t.textContent=o.label;}
}
function ln(gs,pts,o={}){
  if(pts.length<2)return;
  const d=pts.map(p=>gs.X(p.x)+','+gs.Y(p.y)).join(' ');
  S(o.closed?'polygon':'polyline',{points:d,fill:'none',stroke:o.color||'#6c3ce0','stroke-width':o.w||3,'stroke-linejoin':'round','stroke-linecap':'round','stroke-dasharray':o.dash||''},gs.layer);
}
function drawFig(gs,fig){
  (fig.lines||[]).forEach(l=>ln(gs,l.pts,{color:l.color,dash:l.dash}));
  const P=fig.pts||[];
  if(fig.line)ln(gs,P.slice().sort((a,b)=>a.x-b.x));
  if(fig.poly)ln(gs,P,{closed:true});
  if(fig.edges)fig.edges.forEach(e=>ln(gs,[P[e[0]],P[e[1]]],{color:'#241553',w:2.5}));
  P.forEach((p,i)=>mk(gs,p.x,p.y,fig.labeled?{fill:PAL[i%PAL.length],label:p.l,r:6}:{fill:'#241553',r:4}));
}
function figEl(fig){
  const gs=gridSVG(fig.grid);drawFig(gs,fig);
  const w=h('div','figwrap');w.appendChild(gs.svg);return w;
}
function tableEl(t){
  const wrap=h('div','scr');const tb=h('table','tbl');
  const r1=h('tr'),r2_=h('tr');
  r1.appendChild(h('th','',t.head[0]));r2_.appendChild(h('th','',t.head[1]));
  t.xs.forEach((x,i)=>{r1.appendChild(h('td','',t.xfmt?t.xfmt(x):nl(x)));r2_.appendChild(h('td','',t.ys[i]==null?'':(t.yfmt?t.yfmt(t.ys[i]):nl(t.ys[i]))));});
  tb.appendChild(r1);tb.appendChild(r2_);wrap.appendChild(tb);return wrap;
}
function renderCtx(c){
  if(!c)return null;
  const d=h('div','ctx');
  if(c.text)d.appendChild(h('p','ctxt',c.text));
  if(c.table)d.appendChild(tableEl(c.table));
  if(c.fig)d.appendChild(figEl(c.fig));
  if(c.html)d.appendChild(h('div','',c.html));

/* kleine globale grafieken (zonder getallen) */
function gSvg(kind){
  const P={up:'M12 58 L82 12',upoff:'M12 42 L82 10',down:'M12 12 L82 56',flat:'M12 30 L82 30',pause:'M12 58 L34 34 L56 34 L82 8',hill:'M12 58 Q47 -6 82 58',valley:'M12 10 Q47 70 82 10',stopgo:'M12 56 L30 36 L42 36 L60 18 L64 18 L82 6'};
  return `<svg viewBox="0 0 96 70" width="110" height="80" style="display:block;margin:auto"><path d="M8 4V62H92" fill="none" stroke="#241553" stroke-width="2.5"/><path d="${P[kind]}" fill="none" stroke="#ff5ca8" stroke-width="3.5" stroke-linecap="round"/></svg>`;

/* ===== vraagtypen ===== */
function minusBtn(inp){const m=h('button','minus','−');m.type='button';m.onclick=()=>{const v=inp.value.trim();inp.value=(v.startsWith('−')||v.startsWith('-'))?v.slice(1):'−'+v;inp.dispatchEvent(new Event('input'));};return m;}
function numBox(neg,onch,cls){const w=h('span','nin');const i=h('input',cls||'');i.type='text';i.autocomplete='off';i.inputMode=neg?'text':'decimal';i.oninput=onch;if(neg)w.appendChild(minusBtn(i));w.appendChild(i);return {w,i};}
const same=(a,b,t)=>Math.abs(a-b)<=t+1e-9;
const TYPES={
mc(p,body,api){
  let sel=-1;
  const btns=p.opts.map((t,i)=>{const b=h('button','opt',t);b.onclick=()=>{if(api.locked)return;sel=i;btns.forEach((x,j)=>x.classList.toggle('sel',j===i));api.onchange&&api.onchange();};body.appendChild(b);return b;});
  api.answered=()=>sel>=0;api.frac=()=>sel===p.a?1:0;
  api.reveal=()=>{btns.forEach((b,j)=>{if(j===p.a)b.classList.add('right');else if(j===sel)b.classList.add('wrong');});};
  api.solText=`Goed antwoord: <b>${p.opts[p.a]}</b>`;
  api.autofill=()=>{sel=p.a;};api.autowrong=()=>{sel=(p.a+1)%p.opts.length;};
},
num(p,body,api){

plot(p,body,api){
  const gs=gridSVG(p.grid);const wrap=h('div','figwrap interactive');wrap.appendChild(gs.svg);body.appendChild(wrap);
  const g=gs.g,snap=p.snap,tol=p.tol,T=p.targets,labeled=p.mode==='labeled';
  let placed=labeled?{}:[],active=labeled?T[0].l:null;
  const chips=h('div','chips'),chipEls={};
  if(labeled){T.forEach(t=>{const c=h('button','chip',t.l);c.onclick=()=>{if(api.locked)return;active=t.l;paint();};chips.appendChild(c);chipEls[t.l]=c;});body.insertBefore(chips,wrap);}
  const read=h('div','readout','Tik op het raster om een punt te zetten.');body.appendChild(read);
  const paint=()=>{if(!labeled)return;T.forEach(t=>{chipEls[t.l].classList.toggle('on',active===t.l);chipEls[t.l].classList.toggle('done',!!placed[t.l]);});};
  const base=()=>{gs.layer.innerHTML='';(p.preset||[]).forEach(l=>ln(gs,l.pts,{color:l.color||'#3b82f6'}));(p.presetPts||[]).forEach(q=>mk(gs,q.x,q.y,{fill:'#3b82f6',r:4.5,label:q.l}));};
  const draw=()=>{base();
    if(labeled){T.forEach((t,i)=>{const q=placed[t.l];if(q)mk(gs,q.x,q.y,{fill:PAL[i%PAL.length],label:t.l,r:6});});}
    else placed.forEach(q=>mk(gs,q.x,q.y,{fill:'#ff4d6d',r:6}));};
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  gs.svg.addEventListener('click',e=>{
    if(api.locked)return;
    let d=gs.toData(e);let x=cl(Math.round(d.x/snap.x)*snap.x,g.xmin,g.xmax),y=cl(Math.round(d.y/snap.y)*snap.y,g.ymin,g.ymax);
    x=+x.toFixed(6);y=+y.toFixed(6);
    if(labeled){if(!active)active=(T.find(t=>!placed[t.l])||T[0]).l;placed[active]={x,y};read.textContent=`${active}${p.half?ptH(x,y):pt(x,y)}`;const nxt=T.find(t=>!placed[t.l]);if(nxt)active=nxt.l;paint();}
    else{const k=placed.findIndex(q=>Math.abs(q.x-x)<1e-9&&Math.abs(q.y-y)<1e-9);if(k>=0)placed.splice(k,1);else if(placed.length<T.length*2)placed.push({x,y});read.textContent=`Laatste tik: x = ${nl(x)} en y = ${nl(y)}`;}
    draw();api.onchange&&api.onchange();
  });
  base();paint();
  api.answered=()=>labeled?Object.keys(placed).length>0:placed.length>0;
  const okAt=(q,t)=>q&&same(q.x,t.x,tol.x)&&same(q.y,t.y,tol.y);
  api.frac=()=>{
    if(labeled)return T.filter(t=>okAt(placed[t.l],t)).length/T.length;
    const used=new Set();let hit=0;T.forEach(t=>{const k=placed.findIndex((q,i)=>!used.has(i)&&okAt(q,t));if(k>=0){used.add(k);hit++;}});
    return hit/Math.max(T.length,placed.length);
  };
  api.reveal=()=>{
    base();
    const tp=T.map(t=>({x:t.x,y:t.y}));
    if(p.connect==='line')ln(gs,tp.slice().sort((a,b)=>a.x-b.x),{color:'#16a34a'});
    if(p.connect==='order')ln(gs,tp,{color:'#16a34a'});
    if(p.connect==='closed')ln(gs,tp,{color:'#16a34a',closed:true});
    if(p.edges)p.edges.forEach(e=>ln(gs,[tp[e[0]],tp[e[1]]],{color:'#16a34a',w:2.5}));
    T.forEach(t=>mk(gs,t.x,t.y,{ring:true,label:labeled?t.l:null,lc:'#16a34a'}));
    if(labeled)T.forEach((t,i)=>{const q=placed[t.l];if(q)mk(gs,q.x,q.y,{fill:okAt(q,t)?'#2fcf6b':'#ff4d5e',r:5});});
    else placed.forEach(q=>mk(gs,q.x,q.y,{fill:T.some(t=>okAt(q,t))?'#2fcf6b':'#ff4d5e',r:5}));
  };
  api.solText=`De groene stippellijnen laten zien waar de punten horen${p.connect!=='none'||p.edges?' en hoe je ze verbindt':''}.`;
  api.autofill=()=>{if(labeled){T.forEach(t=>placed[t.l]={x:t.x,y:t.y});}else{placed=T.map(t=>({x:t.x,y:t.y}));}draw();paint();};
  api.autowrong=()=>{if(labeled){T.forEach(t=>placed[t.l]={x:g.xmin,y:g.ymin});}else{placed=[{x:g.xmin,y:g.ymin}];}draw();};
}
};

function latticeBetween(B,C){const dx=C.x-B.x,dy=C.y-B.y,g=gcd(dx,dy),out=[];for(let k=1;k<g;k++)out.push({x:B.x+k*dx/g,y:B.y+k*dy/g});return out;}

'use strict';
/* ===================== §3.3 GRAFIEKEN ===================== */
function tempSet(month,kind='neg'){
  const n=8;let t;
  const uniq=t=>{const mx=Math.max(...t),mn=Math.min(...t);return t.filter(v=>v===mx).length===1&&t.filter(v=>v===mn).length===1;};
  do{
    if(kind==='neg'){t=[R(-1,3)];for(let i=1;i<n;i++)t.push(Math.max(-4,Math.min(5,t[i-1]+R(-2,2))));}
    else{t=[R(14,16)];for(let i=1;i<n;i++)t.push(Math.max(12,Math.min(20,t[i-1]+R(-2,2))));}
  }while(!uniq(t)||(kind==='neg'&&(Math.min(...t)>=0||Math.max(...t)<=0)));
  const d0=R(8,20);const pts=t.map((y,i)=>({x:d0+i,y}));
  const grid={style:'chart',xmin:d0,xmax:d0+n-1,ymin:Math.min(...t)-1,ymax:Math.max(...t)+1,ys:1,square:false,w:320,h:230,xlab:month,ylab:'temperatuur (°C)',zaag:kind==='pos'?'y':undefined};
  const twice=[...new Set(t)].filter(v=>t.filter(w=>w===v).length===2);
  return {d0,t,pts,grid,twice,month,ctx:{text:`In de grafiek zie je de minimumtemperatuur van een aantal dagen in ${month}.`,fig:{grid,pts,line:true}}};
}

  return {p,y,pts,grid,ctx:{text:'De grafiek hoort bij een fietstocht van Ahmed.',fig:{grid,pts,line:true}}};
}

function kaarsPair(){

}

/* ===================== OEFENTOETSEN ===================== */
function makeToets(t){
  const O=[];
  // Opgave 1 begrippen
  const B=[[['Hoe heet het beginpunt van de assen in een assenstelsel?',[/oorsprong/],'de oorsprong'],['Hoe heten de lijnen van het rooster in een assenstelsel?',[/rooster\s*lijn/],'roosterlijnen']],
           [['Hoe heten de snijpunten van de roosterlijnen?',[/rooster\s*punt/],'roosterpunten'],['Hoe heet de verticale as?',[/^(de )?y.?as$/],'de y-as']],
           [['Hoe heet een rechte grafiek bij een tabel met regelmaat?',[/line(ai|ai)re?/,/lineair/],'lineaire grafiek'],['Hoe heet een grafiek zonder getallen bij de assen?',[/globa/],'globale grafiek']],
           [['De x-as, de y-as en de oorsprong vormen samen een …',[/assenstelsel/],'assenstelsel'],['Hoe heet het eerste getal in K(3, −2)?',[/x.?co/],'x-coördinaat']]][t];
  O.push({ctx:null,parts:B.map(b=>txt(b[0],b[1],b[2],'Leer de rode begrippen uit het boek.'))});
  // Opgave 2 punten tekenen + roosterpunten tussen
  {const a=R(1,2),b=a+1;const P=[{l:'A',x:-a,y:R(1,2)+.5},{l:'B',x:-b,y:pick([0,.5])},{l:'C',x:0,y:-R(1,2)},{l:'D',x:R(1,3),y:R(0,1)+.5},{l:'E',x:0,y:R(3,4)}];
   const p=drawQ(P,COORD(4),{snap:{x:.5,y:.5},connect:'closed',pts:6});
   p.q=`Teken de punten ${P.map(q=>q.l+ptH(q.x,q.y)).join(', ')} in het assenstelsel. Verbind A met B, B met C, enzovoorts. Verbind ook E met A.<br><small>Tik eerst op een letter en dan op het raster.</small>`;
   const L=lijnPlot();L.p.pts=2;
   O.push({ctx:null,parts:[p,L.p]});}
  // Opgave 3 roosterpunten kleuren
  {const r=rangeInfo();const tg=[];r.xsx.forEach(x=>r.ysy.forEach(y=>tg.push({x,y})));
   O.push({ctx:null,parts:[plot(`Er zijn ${r.n} roosterpunten waarvan de x-coördinaat tussen ${r.a} en ${r.b} ligt en de y-coördinaat tussen ${hf(r.c)} en ${hf(r.d)} ligt. Kleur deze punten rood.`,{grid:{style:'coord',xmin:0,xmax:r.b+1,ymin:0,ymax:Math.ceil(r.d)+1,w:300,h:270},targets:tg,pts:3,uitleg:'Tussen betekent: grenzen niet meetellen.'})]});}
  // Opgave 4 temperatuurgrafiek
  {const month=['maart','oktober','januari','november'][t];const pos=t%2===1;const A=tempSet(pos?'mei':month,pos?'pos':'neg');
   const mn=Math.min(...A.t),mx=Math.max(...A.t);let i=R(0,7),j=R(0,7);while(j===i||A.t[i]===A.t[j])j=R(0,7);if(i>j)[i,j]=[j,i];const k=R(0,7);const pk=A.pts[R(0,7)];
   O.push({ctx:A.ctx,parts:[
     num('Wat is de laagste temperatuur in deze dagen?',mn,'Laagste punt van de grafiek.',{post:'°C',neg:true}),
     mc(`Wat betekent het punt ${pt(pk.x,pk.y)}?`,`Op ${pk.x} ${A.month} is de minimumtemperatuur ${nl(pk.y)} °C.`,[`Op ${pk.y} ${A.month} is de minimumtemperatuur ${pk.x} °C.`,`Op ${pk.x} ${A.month} is het ${nl(pk.y+2)} °C.`,`Om ${pk.x} uur is het ${nl(pk.y)} °C.`].filter((s,q,arr)=>arr.indexOf(s)===q),'Eerste getal: dag (horizontaal). Tweede getal: temperatuur (verticaal).'),
     num(`Hoe groot is het verschil tussen de minimumtemperaturen van ${A.pts[i].x} en ${A.pts[j].x} ${A.month}?`,Math.abs(A.t[i]-A.t[j]),verschilUitleg(A.t[i],A.t[j]),{post:'°C',pts:2}),
     num(`Wat is de minimumtemperatuur van ${A.pts[k].x} ${A.month}?`,A.t[k],'Lees af bij de dag.',{post:'°C',neg:true}),
     pos?zaagQ({set:A,pts:2,ctx:null}):harmanQ({T:mx,pts:2})
   ]});}
  // Opgave 5 tabel naar grafiek (meetgegevens)
  {const c=[{t:'zeehonden in het water',yl:'aantal zeehonden',w:'zeehonden'},{t:'vogels op het strand',yl:'aantal vogels',w:'vogels'},{t:'bezoekers in het zwembad (×10)',yl:'aantal bezoekers (×10)',w:'(×10) bezoekers'},{t:'fietsen in de stalling',yl:'aantal fietsen',w:'fietsen'}][t];
   let ys;do{ys=r10(0,5).map(()=>R(0,12));}while(new Set(ys).size<6);
   const x0=11,xs=r10(11,16),T=xs.map((x,i)=>({x,y:ys[i]}));
   const grid={style:'chart',xmin:10,xmax:17,ymin:0,ymax:Math.ceil((Math.max(...ys)+1)/2)*2,xs:1,ys:1,lbl:{x:1,y:2},square:false,w:300,h:250,xlab:'tijdstip (uur)',ylab:c.yl};
   const kk=R(0,5),mm=(kk+R(1,5))%6;
   O.push({ctx:{text:`In de tabel zie je het aantal ${c.t}.`,table:{head:['tijdstip (uur)',c.yl],xs,ys}},parts:[
     plot('Teken de grafiek bij de tabel.',{grid,targets:T,connect:'line',pts:2,uitleg:'Elk getallenpaar is een punt.'}),
     num(`Op welk tijdstip waren er ${ys[kk]} ${c.w}?`,xs[kk],'Zoek het getal in de onderste rij.',{post:'uur'}),
     mc(`Wat betekent het punt (${xs[mm]}, ${ys[mm]})?`,`Om ${xs[mm]} uur waren er ${ys[mm]} ${c.w}.`,[`Om ${ys[mm]} uur waren er ${xs[mm]} ${c.w}.`,`Om ${xs[mm]} uur waren er ${ys[mm]+3} ${c.w}.`,`Er waren ${xs[mm]+ys[mm]} ${c.w}.`],'Eerste getal hoort bij de horizontale as, tweede bij de verticale.',{pts:2})
   ]});}
  // Opgave 6 woordformule
  {const o=inst(INC.filter(c=>c.money)[[0,2,7,8][t]]);const x=xFor(o);const F=o.W(t%2===0);
   O.push({ctx:{text:`${o.c.intro} Daarbij hoort de woordformule<br><b>${F}</b>`},parts:[
     num('Wat is het vaste bedrag?',o.vast,'Het getal zonder keer.',{pre:'€'}),
     num(`Wat is het bedrag per ${o.c.eenh}?`,o.per,'Het getal vóór het keerteken.',{pre:'€'}),
     num(`Bereken ${o.c.out.replace(' (€)','')} als ${o.c.v} = ${x}.`,o.f(x),`${o.calc(x)} = ${o.fv(o.f(x))}.`,{pre:'€',pts:2})
   ]});}
  // Opgave 7 formule met letters
  {const c=t%2===0?INC.find(q=>q.id===['taxi','schoon','fiets','scooter'][t]):pick(DEC);const o=inst(c);
   const x1=t%2===0?xFor(o):pick(o.xs.slice(1)),x2=t%2===0?xFor(o):pick(o.xs.slice(1).filter(v=>v!==x1));
   O.push({ctx:{text:`${c.intro} Hierbij hoort de formule <b>${o.Lf(false)}</b>. Hierin is ${c.L} ${c.v}.`},parts:[
     num(`Bereken de ${o.nm} voor ${c.L} = ${x1}.`,o.f(x1),`${o.calc(x1)} = ${o.fv(o.f(x1))}.`,Object.assign(o.ansOpts(),{pts:2})),
     num(`Bereken de ${o.nm} voor ${c.L} = ${x2}.`,o.f(x2),`${o.calc(x2)} = ${o.fv(o.f(x2))}.`,Object.assign(o.ansOpts(),{pts:2})),
     num(o.money?'Wat is het vaste bedrag?':`Hoeveel is de ${o.nm} aan het begin?`,o.vast,`Bij ${c.L} = 0.`,o.ansOpts()),
     num(`Met hoeveel ${o.money?'euro':o.u} ${o.dec?'neemt de '+o.nm+' per '+c.eenh+' af':'nemen de '+o.nm+' per '+c.eenh+' toe'}?`,o.per,'Het getal voor de letter.',Object.assign(o.ansOpts(),{neg:false}))
   ]});}
  // Opgave 8 tabel + grafiek bij formule
  {const o=inst(INC.find(c=>c.id===['folder','tuin','sponsor','taxi'][t]));
   O.push({ctx:{text:`${o.c.intro} Hierbij hoort <b>${o.Lf(true)}</b>. Hierin is ${o.c.L} ${o.c.v}.`},parts:[
     table('Vul de tabel in.',o.tbl(true),`Vul elk getal in op de plaats van ${o.c.L}.`,{pts:2}),
     plotFor(o,'Teken de grafiek bij de formule.',{pts:4})
   ]});}
  // Opgave 9 globale grafiek
  {const G=genGlobaal().slice(0,2);G[0].pts=1;G[1].pts=2;O.push({ctx:null,parts:G});}
  return O;
}

'use strict';
const KEY='wiskunde-h3-oefenwereld-v1';
const UNLOCK_ALL=/[?&]unlock/.test(location.search);
function load(){try{return Object.assign({lv:{},toets:{},coins:0},JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){return {lv:{},toets:{},coins:0};}}
let SAVE=load();
function store(){try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){}}
const app=document.getElementById('app');
const allLevels=()=>WORLDS.flatMap(w=>w.levels);
const h3Levels=()=>WORLDS.filter(w=>!w.optional).flatMap(w=>w.levels);
const stars=id=>(SAVE.lv[id]&&SAVE.lv[id].stars)||0;
const passed=id=>stars(id)>=2;
function unlocked(L){
  if(UNLOCK_ALL)return true;
  const chain=L.world.optional?L.world.levels:h3Levels();
  const i=chain.indexOf(L);return i===0||passed(chain[i-1].id);
}
const toetsOpen=()=>UNLOCK_ALL||h3Levels().every(l=>passed(l.id));
const starStr=n=>[1,2,3].map(i=>`<span class="${i<=n?'':'off'}">⭐</span>`).join('');
function confetti(){const E=['⭐','🎉','✨','🟣','🟡','💗'];for(let i=0;i<36;i++){const s=h('span','confetti',pick(E));s.style.left=R(0,100)+'vw';s.style.animationDuration=(1.6+Math.random()*1.6)+'s';s.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3800);}}
function ask(msg,yes,cb){const ov=h('div','ov');const sh=h('div','sheet');sh.innerHTML=`<h3><span class="ico" style="background:var(--yellow)">🤔</span>Even checken</h3><p style="margin:12px 0 18px;font-size:16px">${msg}</p>`;const y=h('button','btn pink',yes);y.onclick=()=>{close();cb();};const n=h('button','btn alt','Nee, terug');n.style.marginTop='10px';n.onclick=close;sh.appendChild(y);sh.appendChild(n);ov.appendChild(sh);ov.onclick=e=>{if(e.target===ov)close();};document.body.appendChild(ov);}
function close(){const o=document.querySelector('.ov');if(o)o.remove();}
let cur=null;

/* ---------- kaart ---------- */
function renderHome(){
  cur=null;window.scrollTo(0,0);app.innerHTML='';
  const totStars=allLevels().reduce((a,l)=>a+stars(l.id),0);
  const top=h('div','top');top.innerHTML=`<div class="logo">Wiskunde Oefenwereld<small>H3 Assenstelsel · §3.2 t/m §3.6</small></div><span class="chip-s">⭐ ${totStars}</span><span class="chip-s">🪙 ${SAVE.coins}</span>`;
  app.appendChild(top);
  const H=h3Levels(),done=H.filter(l=>passed(l.id)).length;
  const hero=h('div','hero');hero.innerHTML=`<b>Op weg naar de toets!</b><p>Haal elk level met minstens 5 van de 6 goed. Dan gaat het volgende open. Als alles klaar is, gaan de 4 oefentoetsen open.</p><div class="bar"><i style="width:${Math.round(done/H.length*100)}%"></i></div><p style="margin-top:6px">${done} van ${H.length} levels gehaald</p>`;
  app.appendChild(hero);
  const sp=h('button','btn alt','📘 Spiekbrief: alle theorie');sp.style.marginTop='14px';sp.onclick=renderSpiek;app.appendChild(sp);
  WORLDS.forEach(w=>{
    const sec=h('div','world');
    const n=w.levels.filter(l=>passed(l.id)).length;
    const ban=h('div','wban'+(w.dark?' dark':''));ban.style.background=w.color;
    ban.innerHTML=`<span class="big">${w.icon}</span><div><h2>${w.title}</h2><p>${w.sub}</p></div><span class="cnt">${n}/${w.levels.length}</span>`;
    sec.appendChild(ban);
    const path=h('div','path');
    let curSet=false;
    w.levels.forEach(L=>{
      const op=unlocked(L),st=stars(L.id);
      const isCur=op&&!passed(L.id)&&!curSet;if(isCur)curSet=true;
      const nd=h('div','node'+(op?'':' locked')+(isCur?' current':''));
      const dot=h('button','dot',op?L.icon:'🔒');dot.style.setProperty('--c',w.color);dot.setAttribute('aria-label',L.name);
      dot.onclick=()=>op?openSheet(L):lockedMsg(L);
      nd.appendChild(dot);nd.appendChild(h('div','nlab',L.name));nd.appendChild(h('div','stars',starStr(st)));
      path.appendChild(nd);
    });
    sec.appendChild(path);app.appendChild(sec);
  });
  const ts=h('div','world');
  const tb=h('div','wban');tb.style.background='#241553';tb.innerHTML=`<span class="big">🏆</span><div><h2>Eindbaas: oefentoetsen</h2><p>Zoals de echte toets · met cijfer</p></div>`;
  ts.appendChild(tb);
  const grid=h('div','tgrid');const open=toetsOpen();
  [0,1,2,3].forEach(t=>{const c=h('button','tcard'+(open?'':' locked'));const b=SAVE.toets[t];
    c.innerHTML=`<div class="n">${open?'📝':'🔒'}</div>Oefentoets ${t+1}<small>${open?'± 40 punten':'Eerst alle levels van §3.2 t/m §3.6'}</small>${b?`<span class="best">Beste: ${nl(b.best)}</span>`:''}`;
    c.onclick=()=>open?startToets(t):lockedMsg(null);grid.appendChild(c);});
  ts.appendChild(grid);app.appendChild(ts);
  const f=h('div','foot');f.innerHTML='Je voortgang wordt op dit apparaat bewaard.<br>';
  const rs=h('button','link','Voortgang wissen');rs.onclick=()=>ask('Weet je zeker dat je al je sterren en voortgang wilt wissen?','Ja, alles wissen',()=>{SAVE={lv:{},toets:{},coins:0};store();renderHome();});
  f.appendChild(rs);app.appendChild(f);
}
function lockedMsg(L){
  const ov=h('div','ov');const s=h('div','sheet');
  s.innerHTML=`<h3><span class="ico" style="background:#e3dff0">🔒</span>Nog op slot</h3><p style="margin:12px 0 18px;font-size:16px">${L?'Haal eerst het level ervoor met minstens 5 van de 6 goed.':'Haal eerst alle levels van §3.2 t/m §3.6.'}</p>`;
  const b=h('button','btn purple','Oké');b.onclick=close;s.appendChild(b);ov.appendChild(s);ov.onclick=e=>{if(e.target===ov)close();};document.body.appendChild(ov);
}
function openSheet(L){
  const ov=h('div','ov');const s=h('div','sheet');
  s.innerHTML=`<h3><span class="ico" style="background:${L.world.color}">${L.icon}</span>${L.name}</h3><div style="margin-top:6px;font-size:14px">${L.world.title} · ${starStr(stars(L.id))}</div><div class="learn"><b class="t">Onthoud</b>${L.leer}</div>`;
  const b=h('button','btn','Start! 6 vragen');b.onclick=()=>{close();startLevel(L);};s.appendChild(b);
  const c=h('button','link','Terug');c.style.display='block';c.style.margin='8px auto 0';c.onclick=close;s.appendChild(c);
  ov.appendChild(s);ov.onclick=e=>{if(e.target===ov)close();};document.body.appendChild(ov);
}

/* ---------- oefenen ---------- */
function startLevel(L){cur={mode:'level',L,qs:L.gen(),i:0,res:[]};renderQ();}
function topBar(onX,inner){const t=h('div','ptop');const x=h('button','x','✕');x.onclick=onX;x.setAttribute('aria-label','Stoppen');t.appendChild(x);if(inner)t.appendChild(inner);return t;}
function renderQ(){
  window.scrollTo(0,0);app.innerHTML='';
  const q=cur.qs[cur.i];
  const prog=h('div','prog');cur.qs.forEach((_,k)=>{const i=h('i');if(k<cur.res.length)i.className=cur.res[k]?'ok':'no';else if(k===cur.i)i.className='now';prog.appendChild(i);});
  app.appendChild(topBar(renderHome,prog));
  const card=h('div','qcard');
  const cx=renderCtx(q.ctx);if(cx)card.appendChild(cx);
  const api=buildPart(q);card.appendChild(api.el);app.appendChild(card);
  const bot=h('div','bottom');const inn=h('div','in');const btn=h('button','btn','Controleer');btn.disabled=true;inn.appendChild(btn);bot.appendChild(inn);app.appendChild(bot);
  api.onchange=()=>{btn.disabled=!api.answered();};
  btn.onclick=()=>{
    if(btn.dataset.next){cur.i++;if(cur.i<cur.qs.length)renderQ();else finishLevel();return;}
    const ok=api.frac()>0.999;api.lock();api.reveal();cur.res.push(ok);
    if(ok){SAVE.coins+=10;store();}
    const fb=h('div','fb '+(ok?'ok':'no'));
    fb.innerHTML=`<div class="h">${ok?pick(['Goed zo! 🎉','Top! ⭐','Yes, klopt! 💪','Super! ✨'])+' <small>+10 🪙</small>':pick(['Bijna! 💡','Net niet 🙈','Oeps, kijk even mee 👀'])}</div>${ok?'':api.solText}${q.uitleg?`<div class="u">${q.uitleg}</div>`:''}`;
    card.appendChild(fb);fb.scrollIntoView({behavior:'smooth',block:'nearest'});
    btn.textContent=cur.i<cur.qs.length-1?'Volgende →':'Klaar!';btn.dataset.next='1';btn.className='btn '+(ok?'':'purple');
  };
}
function finishLevel(){
  const ok=cur.res.filter(Boolean).length,n=cur.res.length;
  const st=ok===n?3:ok===n-1?2:0;const L=cur.L;
  const prev=stars(L.id);SAVE.lv[L.id]={stars:Math.max(prev,st)};store();
  window.scrollTo(0,0);app.innerHTML='';
  const r=h('div','res');const c=h('div','card stack');
  const chain=L.world.optional?L.world.levels:h3Levels();const nxt=chain[chain.indexOf(L)+1];
  c.innerHTML=`<div class="bigstars">${st?starStr(st):'💪'}</div><h2>${st===3?'Perfect!':st===2?'Gehaald!':'Nog even oefenen'}</h2><p>Je had er <b>${ok} van de ${n}</b> goed.${st?'':' Je hebt er minstens '+(n-1)+' nodig. Je krijgt nieuwe vragen.'}</p>`;
  if(st){confetti();}
  const again=h('button','btn '+(st?'alt':''),st?'Nog een keer (nieuwe vragen)':'Opnieuw proberen');again.onclick=()=>startLevel(L);
  if(st&&nxt&&unlocked(nxt)){const nb=h('button','btn',`Volgende: ${nxt.name} →`);nb.onclick=()=>openSheet(nxt);c.appendChild(nb);}
  else if(st&&!nxt&&!L.world.optional&&toetsOpen()){const nb=h('button','btn pink','Naar de oefentoetsen 🏆');nb.onclick=renderHome;c.appendChild(nb);}
  c.appendChild(again);
  const hm=h('button','btn alt','Terug naar de kaart');hm.onclick=renderHome;c.appendChild(hm);
  r.appendChild(c);app.appendChild(r);
}

/* ---------- toets ---------- */
function startToets(t){cur={mode:'toets',t,opg:makeToets(t),apis:[]};renderToets();}
function renderToets(){
  window.scrollTo(0,0);app.innerHTML='';
  const t=h('div','');t.innerHTML=`<b style="font-size:18px">Oefentoets ${cur.t+1}</b><div style="font-size:12px">H3 §3.2 t/m §3.6 · rekenmachine mag · schrijf je berekening op papier</div>`;t.style.flex='1';
  app.appendChild(topBar(()=>{if(cur.done)renderHome();else ask('Stoppen? Je antwoorden gaan verloren.','Ja, stoppen',renderHome);},t));
  const head=h('div','');app.appendChild(head);
  let max=0;
  cur.opg.forEach((o,k)=>{
    const c=h('div','opg');c.appendChild(h('h3','',`Opgave ${k+1}`));
    const cx=renderCtx(o.ctx);if(cx)c.appendChild(cx);
    o.parts.forEach((p,j)=>{max+=p.pts;const sub=p.ctx?renderCtx(p.ctx):null;const api=buildPart(p,{label:o.parts.length>1?'abcdefg'[j]:'',showPts:true});if(sub)api.el.insertBefore(sub,api.el.children[1]);c.appendChild(api.el);cur.apis.push({api,p});});
    app.appendChild(c);
  });
  cur.max=max;
  const bot=h('div','bottom');const inn=h('div','in');const btn=h('button','btn pink','Inleveren');inn.appendChild(btn);bot.appendChild(inn);app.appendChild(bot);
  btn.onclick=()=>{
    if(cur.done){renderHome();return;}
    const open=cur.apis.filter(a=>!a.api.answered()).length;
    if(open&&!btn.dataset.sure){ask(`Je hebt nog ${open} ${open===1?'vraag':'vragen'} niet beantwoord. Toch inleveren?`,'Ja, inleveren',()=>{btn.dataset.sure='1';btn.click();});return;}
    let score=0;
    cur.apis.forEach(({api,p})=>{
      const f=api.answered()?api.frac():0;const got=Math.round(f*p.pts*2)/2;score+=got;
      api.lock();api.reveal();api.el.classList.add(got===p.pts?'okp':'nop');
      const pq=api.el.querySelector('.pq');pq.insertAdjacentHTML('afterbegin',`<span class="mark">${got===p.pts?'✅':got>0?'🟡':'❌'}</span>`);
      pq.insertAdjacentHTML('beforeend',`<span class="pscore">${nl(got)} / ${p.pts}</span>`);
      const sol=h('div','psol',(got===p.pts?'':api.solText+'<br>')+(p.uitleg||''));if(got!==p.pts||p.uitleg)api.el.appendChild(sol);
    });
    const cijfer=Math.max(1,Math.round((1+9*score/cur.max)*10)/10);
    const b=SAVE.toets[cur.t];SAVE.toets[cur.t]={best:Math.max(b?b.best:0,cijfer)};store();
    cur.done=true;
    head.innerHTML='';const rc=h('div','res');rc.style.marginTop='16px';
    rc.innerHTML=`<div class="card"><div class="cijfer">${nl(cijfer)}</div><h2>${cijfer>=8?'Wauw, top! 🏆':cijfer>=5.5?'Voldoende! 👍':'Nog even oefenen 💪'}</h2><p>Je had <b>${nl(score)} van de ${cur.max}</b> punten. Hieronder zie je per vraag wat goed en fout ging.</p></div>`;
    head.appendChild(rc);if(cijfer>=5.5)confetti();
    btn.textContent='Terug naar de kaart';btn.className='btn';window.scrollTo({top:0,behavior:'smooth'});
  };
}

/* ---------- spiekbrief ---------- */
function renderSpiek(){
  window.scrollTo(0,0);app.innerHTML='';
  const t=h('div','');t.innerHTML='<b style="font-size:18px">📘 Spiekbrief H3</b>';t.style.flex='1';
  app.appendChild(topBar(renderHome,t));
  SPIEK.forEach(([ti,body])=>{const c=h('div','opg');c.appendChild(h('h3','',ti));c.appendChild(h('div','',body));c.style.fontSize='15px';app.appendChild(c);});
  const ex=h('div','opg');ex.innerHTML='<h3>Voorbeeld assenstelsel</h3>';
  ex.appendChild(figEl({grid:COORD(3),pts:[{l:'K',x:3,y:-2},{l:'L',x:-1.5,y:2},{l:'M',x:-1,y:-2.5}],labeled:true}));
  ex.appendChild(h('p','','K(3, −2) is een roosterpunt. L(−1½, 2) en M(−1, −2½) niet.'));
  app.appendChild(ex);
}

/* ---------- testhulp (alleen voor de maker) ---------- */
window.__selfTest=function(rounds=25){
  const errs=[];const host=h('div');
  const check=(p,where)=>{
    try{
      if(p.type==='mc'){if(p.a<0||new Set(p.opts).size!==p.opts.length)errs.push(where+': mc-opties dubbel/ongeldig '+JSON.stringify(p.opts));}
      if(p.type==='num'&&!isFinite(p.a))errs.push(where+': antwoord geen getal');
      const api=buildPart(p);host.appendChild(api.el);api.autofill();
      if(api.frac()<0.999)errs.push(where+': goed antwoord wordt fout gerekend: '+p.q.slice(0,90));
      const api2=buildPart(p);api2.autowrong();if(api2.frac()>0.999)errs.push(where+': fout antwoord wordt goed gerekend: '+p.q.slice(0,80));
      if(p.ctx){renderCtx(p.ctx);}
      if(/undefined|NaN/.test(p.q+(p.uitleg||'')+(p.opts||[]).join('')))errs.push(where+': undefined/NaN in tekst: '+p.q.slice(0,120));
    }catch(e){errs.push(where+': '+e.message);}
  };
  for(let r=0;r<rounds;r++){
    allLevels().forEach(L=>{let qs;try{qs=L.gen();}catch(e){errs.push(L.id+' gen: '+e.message);return;}if(qs.length!==6)errs.push(L.id+': '+qs.length+' vragen');qs.forEach((p,k)=>check(p,L.id+'#'+k));});
    [0,1,2,3].forEach(t=>{try{const O=makeToets(t);O.forEach((o,k)=>{if(o.ctx)renderCtx(o.ctx);o.parts.forEach((p,j)=>check(p,'T'+(t+1)+'.'+(k+1)+'abcdefg'[j]));});}catch(e){errs.push('toets '+t+': '+e.message);}});
  }
  return [...new Set(errs)].slice(0,60);
};
renderHome();
